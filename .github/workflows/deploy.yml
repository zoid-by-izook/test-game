name: Build and Deploy to GitHub Pages

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  GODOT_VERSION: "4.7.2"

# One Pages publish per ref at a time; a new push to the same PR or main
# cancels the in-flight one so previews never lag behind the branch.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Export Web build
    # On PR close only the preview cleanup needs to run -- skip the export.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download Godot headless binary
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Download and install export templates
        run: |
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p /tmp/godot-templates
          unzip -q templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Export Web build
        run: |
          mkdir -p exports/web
          # Explicit import step: ensures .godot/imported/ is populated before
          # export. Without this, headless exports can reference imported
          # resource paths in the .pck without including their data.
          "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --import
          "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --export-release "Web" ./exports/web/index.html

      - name: Patch web audio autoplay unlock
        run: |
          # Chrome suspends Godot's AudioContext until a user gesture. Godot 4.7.2
          # does not resume it on input by itself, and the resume helper
          # (_godot_audio_resume) lives inside the Emscripten module scope where
          # page-level JavaScript cannot reach it. So we inject global gesture
          # listeners from INSIDE the module scope, right after the resume
          # function definition. The browser then allows ctx.resume() because it
          # runs inside a real user-gesture handler.
          python3 << 'PYEOF'
          path = 'exports/web/index.js'
          with open(path, 'r') as f:
              content = f.read()

          marker = 'function _godot_audio_resume(){'
          start = content.find(marker)
          if start == -1:
              print('WARNING: _godot_audio_resume not found - audio unlock NOT patched')
          else:
              # Brace-match to find the end of the function definition.
              depth = 0
              end = -1
              for i in range(start, min(start + 2000, len(content))):
                  ch = content[i]
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end == -1:
                  print('WARNING: could not find end of _godot_audio_resume - NOT patched')
              else:
                  # TEMPORARY DEBUG (remove before merge): log the AudioContext state
                  # on every gesture and expose window.__godotAudioDbg so the game
                  # overlay and devtools console can read it. The engine lives
                  # inside an IIFE closure, so page-level JS cannot otherwise see
                  # GodotAudio (verified 2026-09-20).
                  injection = (
                      ';(function(){'
                      'var _audbg_state=function(){return GodotAudio.ctx?GodotAudio.ctx.state:"null";};'
                      'window.__godotAudioDbg={state:_audbg_state,'
                      'resume:function(){_godot_audio_resume();return _audbg_state();}};'
                      '["pointerdown","keydown","touchstart","mousedown"].forEach(function(ev){'
                      'window.addEventListener(ev,function(){'
                      'console.log("[audio-unlock] gesture="+ev+" before="+_audbg_state());'
                      'try{_godot_audio_resume();'
                      'var pr=GodotAudio.ctx?GodotAudio.ctx.resume():null;'
                      'if(pr&&pr.then){pr.then(function(){'
                      'console.log("[audio-unlock] resume resolved, state="+_audbg_state());});}'
                      '}catch(e){console.log("[audio-unlock] error: "+e);}'
                      '});});})();'
                  )
                  content = content[:end] + injection + content[end:]
                  with open(path, 'w') as f:
                      f.write(content)
                  print('Audio unlock patched into index.js')
          PYEOF

      - name: Capture website screenshots
        run: |
          # Serve the exported site locally, then screenshot the website shell
          # (start menu + credits card, both plain HTML) at desktop and mobile
          # sizes with headless Chrome.
          #
          # NOTE: We do NOT boot the Godot game here. The game hangs during
          # engine init under SwiftShader (software WebGL) in CI -- it boots
          # fine in real browsers and under Xvfb with real GL. Gameplay
          # screenshots are static renders (see below), and the deployed PR
          # preview runs the real playable game for human verification.
          python3 -m http.server 8901 --directory exports/web >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8901/index.html >/dev/null && break
            sleep 1
          done
          mkdir -p website-screenshots
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium binary found; skipping website screenshots."
          else
            npm install --no-audit --no-fund --prefix /tmp/shot-deps puppeteer-core
            cat > /tmp/shot.js <<'EOF'
          const puppeteer = require('/tmp/shot-deps/node_modules/puppeteer-core');
          (async () => {
            for (const [w, h, name] of [[1280, 800, 'website-desktop-1280x800.png'],
                                        [390, 844, 'website-mobile-390x844.png']]) {
              const browser = await puppeteer.launch({
                executablePath: process.env.CHROME_BIN,
                args: ['--no-sandbox', '--disable-dev-shm-usage', '--hide-scrollbars'],
              });
              try {
                const page = await browser.newPage();
                await page.setViewport({width: w, height: h});
                await page.goto('http://127.0.0.1:8901/index.html', {waitUntil: 'load'});
                // Wait for the website shell (plain HTML) to render.
                // Do NOT wait for game boot -- SwiftShader hangs on it.
                await page.waitForSelector('.detail-card', {timeout: 30000});
                await new Promise((r) => setTimeout(r, 2000));
                // Screenshot the website shell (header + detail cards).
                await page.screenshot({path: 'website-screenshots/' + name.replace('.png', '-shell.png')});
                // Credits evidence: every art PR updates the credits card, so
                // scroll it into view and capture it alongside the standard
                // website screenshots.
                await page.evaluate(() => {
                  for (const el of document.querySelectorAll('.detail-card h2')) {
                    if (el.textContent.trim() === 'Credits') {
                      el.scrollIntoView({block: 'center'});
                      break;
                    }
                  }
                });
                await new Promise((r) => setTimeout(r, 1500));
                await page.screenshot({path: 'website-screenshots/' + name.replace('.png', '-credits.png')});
                await page.close();
              } finally {
                await browser.close();
              }
            }
          })();
          EOF
            CHROME_BIN="$CHROME" node /tmp/shot.js
          fi
          kill $SERVER_PID || true
          # Fetch static gameplay renders from the pr-assets branch. These are
          # rendered locally (Xvfb + real GL) because SwiftShader cannot boot
          # the game in CI. Labeled as static renders in the PR body; the
          # deployed preview is the real playable game.
          PR_NUM="${{ github.event.pull_request.number }}"
          if [ -n "$PR_NUM" ]; then
            for f in gameplay-desktop-1280x800.png gameplay-mobile-390x844.png; do
              URL="https://raw.githubusercontent.com/zoid-by-izook/test-game/pr-assets/pr-${PR_NUM}/${f}"
              if curl -sfL "$URL" -o "website-screenshots/${f}"; then
                echo "Fetched static gameplay image: ${f}"
              else
                echo "WARNING: static gameplay image not found: ${URL}"
                echo "Render it locally and push to pr-assets/pr-${PR_NUM}/"
              fi
            done
          fi
          ls -la website-screenshots

      - name: Upload website screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-screenshots
          path: website-screenshots
          if-no-files-found: warn

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: exports/web

  deploy-main:
    name: Deploy main site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: site

      - name: Publish to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          # Keep pr-<n> preview directories across main deploys.
          keep_files: true

  deploy-preview:
    name: Deploy PR preview
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: site

      - name: Publish preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          destination_dir: pr-${{ github.event.pull_request.number }}

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const url = `https://zoid-by-izook.github.io/test-game/pr-${pr}/`;
            const marker = '<!-- pr-preview -->';
            const body = `${marker}\n🎮 **Playable preview:** [${url}](${url})\n\nBuilt from this PR's latest commit — play the game right in your browser. The main site is untouched.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            const params = { owner: context.repo.owner, repo: context.repo.repo, body };
            if (existing) {
              await github.rest.issues.updateComment({ ...params, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: pr });
            }

  cleanup-preview:
    name: Remove PR preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove preview directory
        run: |
          DIR="pr-${{ github.event.pull_request.number }}"
          if [ -d "$DIR" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -r --quiet "$DIR"
            git commit -m "Remove preview for PR #${{ github.event.pull_request.number }}"
            git push origin gh-pages
          else
            echo "No preview directory $DIR; nothing to clean."
          fi
