name: Build and Deploy to GitHub Pages

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  GODOT_VERSION: "4.7.2"

# One Pages publish per ref at a time; a new push to the same PR or main
# cancels the in-flight one so previews never lag behind the branch.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Export Web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download Godot headless binary
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Download and install export templates
        run: |
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p /tmp/godot-templates
          unzip -q templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Export Web build
        run: |
          mkdir -p exports/web
          "./Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --export-release "Web" ./exports/web/index.html

      - name: Capture website screenshots
        run: |
          # Serve the exported site locally, then screenshot it at desktop and
          # mobile sizes with headless Chrome (software WebGL via SwiftShader).
          # Readiness = the engine's #status overlay being removed from the DOM,
          # which happens exactly when the game finishes booting -- no guessing
          # with virtual-time budgets (those fast-forward past wasm compile).
          python3 -m http.server 8901 --directory exports/web >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8901/index.html >/dev/null && break
            sleep 1
          done
          mkdir -p website-screenshots
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium binary found; skipping website screenshots."
          else
            npm install --no-audit --no-fund --prefix /tmp/shot-deps puppeteer-core
            cat > /tmp/shot.js <<'EOF'
          const puppeteer = require('/tmp/shot-deps/node_modules/puppeteer-core');
          (async () => {
            for (const [w, h, name] of [[1280, 800, 'website-desktop-1280x800.png'],
                                        [390, 844, 'website-mobile-390x844.png']]) {
              // Fresh browser per viewport: a second page in the same browser
              // session intermittently gets a degraded WebGL context under
              // SwiftShader (HUD renders, 3D stays black).
              const browser = await puppeteer.launch({
                executablePath: process.env.CHROME_BIN,
                args: ['--no-sandbox', '--disable-dev-shm-usage', '--hide-scrollbars',
                       '--use-angle=swiftshader', '--enable-unsafe-swiftshader'],
              });
              try {
                const page = await browser.newPage();
                await page.setViewport({width: w, height: h});
                await page.goto('http://127.0.0.1:8901/index.html', {waitUntil: 'load'});
                // The engine removes #status when boot completes.
                await page.waitForFunction(() => !document.getElementById('status'),
                                           {timeout: 180000, polling: 1000});
                // Then wait for 90 presented frames AND 30s wall-clock so
                // software-rendered 3D (incl. first-use shader compiles)
                // actually lands on screen. Frame-count alone is not enough:
                // rAF can fire much faster than SwiftShader completes frames.
                await page.waitForFunction(() => {
                  return new Promise((resolve) => {
                    const start = performance.now();
                    let frames = 0;
                    const tick = () => {
                      frames++;
                      const elapsed = performance.now() - start;
                      if (frames >= 90 && elapsed >= 30000) { resolve(true); }
                      else { requestAnimationFrame(tick); }
                    };
                    requestAnimationFrame(tick);
                  });
                }, {timeout: 180000, polling: 1000});
                // Dismiss the start menu so screenshots show gameplay, then
                // give the scene a moment to settle before capturing.
                await page.keyboard.press('Enter');
                await new Promise((r) => setTimeout(r, 3000));
                await page.screenshot({path: 'website-screenshots/' + name});
                // Credits evidence: every art PR updates the credits card, so
                // scroll it into view and capture it alongside the standard
                // website screenshots.
                await page.evaluate(() => {
                  for (const el of document.querySelectorAll('.detail-card h2')) {
                    if (el.textContent.trim() === 'Credits') {
                      el.scrollIntoView({block: 'center'});
                      break;
                    }
                  }
                });
                await new Promise((r) => setTimeout(r, 1500));
                await page.screenshot({path: 'website-screenshots/' + name.replace('.png', '-credits.png')});
                await page.close();
              } finally {
                await browser.close();
              }
            }
          })();
          EOF
            CHROME_BIN="$CHROME" node /tmp/shot.js
          fi
          kill $SERVER_PID || true
          ls -la website-screenshots

      - name: Upload website screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-screenshots
          path: website-screenshots
          if-no-files-found: warn

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: exports/web

  deploy-main:
    name: Deploy main site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: site

      - name: Publish to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          # Keep pr-<n> preview directories across main deploys.
          keep_files: true

  deploy-preview:
    name: Deploy PR preview
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: site

      - name: Publish preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          destination_dir: pr-${{ github.event.pull_request.number }}

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const url = `https://zoid-by-izook.github.io/test-game/pr-${pr}/`;
            const marker = '<!-- pr-preview -->';
            const body = `${marker}\n🎮 **Playable preview:** [${url}](${url})\n\nBuilt from this PR's latest commit — play the game right in your browser. The main site is untouched.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            const params = { owner: context.repo.owner, repo: context.repo.repo, body };
            if (existing) {
              await github.rest.issues.updateComment({ ...params, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: pr });
            }

  cleanup-preview:
    name: Remove PR preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove preview directory
        run: |
          DIR="pr-${{ github.event.pull_request.number }}"
          if [ -d "$DIR" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -r --quiet "$DIR"
            git commit -m "Remove preview for PR #${{ github.event.pull_request.number }}"
            git push origin gh-pages
          else
            echo "No preview directory $DIR; nothing to clean."
          fi
