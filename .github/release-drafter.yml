name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
  - title: '🐛 Fixes'
    labels:
      - 'fix'
  - title: '🧹 Chores'
    labels:
      - 'chore'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'

template: |
  ## What's Changed

  $CHANGES

version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'feature'
  patch:
    labels:
      - 'fix'
      - 'chore'
  default: patch

# Our branch convention (feat/*, fix/*, chore|test|docs/*) labels PRs automatically.
autolabeler:
  - label: 'feature'
    branch:
      - '/^feat(\/|-.+)/'
  - label: 'fix'
    branch:
      - '/^fix(\/|-.+)/'
  - label: 'chore'
    branch:
      - '/^(chore|test|docs)(\/|-.+)/'
