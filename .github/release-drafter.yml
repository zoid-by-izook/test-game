name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    semver-increment: 'minor'
    when:
      label: 'feature'
  - title: '🐛 Fixes'
    when:
      label: 'fix'
  - title: '🧹 Chores'
    when:
      label: 'chore'
  - type: 'version-resolver'
    semver-increment: 'patch'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'

template: |
  ## What's Changed

  $CHANGES

# Our branch convention (feat/*, fix/*, chore|test|docs/*) labels PRs automatically.
# Runs via the separate autolabeler action (release-drafter/release-drafter/autolabeler).
autolabeler:
  - label: 'feature'
    branch:
      - '/^feat(\/|-.+)/'
  - label: 'fix'
    branch:
      - '/^fix(\/|-.+)/'
  - label: 'chore'
    branch:
      - '/^(chore|test|docs)(\/|-.+)/'
